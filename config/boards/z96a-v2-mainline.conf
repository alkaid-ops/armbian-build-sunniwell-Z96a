# SPDX-License-Identifier: GPL-2.0
# Sunniwell Z96A Type-C, mainline Linux 7.2 test profile.
# Keeps the legacy BSP board untouched; USB is the primary test medium.

BOARD_NAME="z96a-v2-mainline"
BOARDFAMILY="rockchip-rk3568-z96a"
BOARD_MAINTAINER="alkaid-ops"
BOOTCONFIG="z96a-rk3568-laptop-v2_defconfig"
LINUXCONFIG="linux-rockchip-rk3568-z96a-mainline"
KERNEL_TARGET="mainline"
declare -g KERNEL_SKIP_MAKEFILE_VERSION="yes"
declare -g EXTRAWIFI="no"
KERNELPATCHDIR="rockchip-rk3568-z96a/mainline"
FULL_DESKTOP="yes"
BOOT_LOGO="disabled"
BOOT_FDT_FILE="rockchip/rk3568-sunniwell-z96a-typec.dtb"
# Use Armbian native extlinux; no boot.scr/armbianEnv.txt is generated.
declare -g SRC_EXTLINUX="yes"
IMAGE_PARTITION_TABLE="gpt"
BOOT_SCENARIO="spl-blobs"
BOOTFS_TYPE="fat"
BOOTSIZE="512"

DDR_BLOB="rk35/rk3568_ddr_1184MHz_android5042_z96a.bin"
BL31_BLOB="bin/rk35/rk3568_bl31_v1.46.elf"
RKBIN_GIT_URL="https://github.com/rockchip-linux/rkbin.git"
RKBIN_GIT_BRANCH="master"

function add_host_dependencies__z96a_mainline_pyelftools_for_binman() {
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} python3-pyelftools"
}


function custom_kernel_config__z96a_mainline_drivers() {
	[[ "${BRANCH}" == "mainline" ]] || return 0
	[[ -f .config ]] || return 0
	kernel_config_set_m CONFIG_SND_SOC_ES7202
	kernel_config_set_m CONFIG_PHY_ROCKCHIP_NANENG_EDP
	kernel_config_set_m CONFIG_MFD_BQ257XX
	kernel_config_set_m CONFIG_CHARGER_BQ257XX
	kernel_config_set_m CONFIG_FUEL_GAUGE_BQ257XX
	kernel_config_set_n CONFIG_REGULATOR_BQ257XX
	kernel_config_set_m CONFIG_DRM_ANALOGIX_DP
	kernel_config_set_m CONFIG_DRM_PANEL_EDP
	kernel_config_set_m CONFIG_TYPEC_TCPCI
	kernel_config_set_m CONFIG_TYPEC_RT1711H
	kernel_config_set_m CONFIG_TYPEC_MUX_GPIO_SBU
	kernel_config_set_y CONFIG_USB_ROLE_SWITCH
	kernel_config_set_m CONFIG_RTW88_8822CS
	kernel_config_set_y CONFIG_BT_HCIUART_RTL
	kernel_config_set_m CONFIG_DRM_PANFROST
	kernel_config_set_m CONFIG_VIDEO_ROCKCHIP_VDEC
	kernel_config_set_y CONFIG_DEBUG_INFO_NONE
	kernel_config_set_n CONFIG_DEBUG_INFO_BTF
	kernel_config_set_n CONFIG_DEBUG_INFO_BTF_MODULES
	kernel_config_set_y CONFIG_FW_LOADER_COMPRESS
	kernel_config_set_y CONFIG_FW_LOADER_COMPRESS_ZSTD
}

function post_family_config__z96a_mainline_packages() {
	[[ "${BRANCH}" == "mainline" ]] || return 0
	add_packages_to_image firmware-realtek wireless-regdb bluez iw rfkill \
		mesa-utils libgl1-mesa-dri libegl-mesa0 libgles2 \
		v4l-utils ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base \
		gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
}

function pre_customize_image__z96a_mainline_userspace() {
	[[ "${BRANCH}" == "mainline" ]] || return 0
	mkdir -p "${SDCARD}/etc/modprobe.d" "${SDCARD}/etc/udev/hwdb.d" "${SDCARD}/etc/udev/rules.d" "${SDCARD}/etc/initramfs-tools"
	printf '%s\n' 'options rtw88_core disable_lps_deep=y' > "${SDCARD}/etc/modprobe.d/rtw88.conf"
	printf '%s\n' 'blacklist hci_uart' > "${SDCARD}/etc/modprobe.d/99-z96a-bt-blacklist.conf"
	cat > "${SDCARD}/etc/udev/hwdb.d/99-sunniwell-z96a-typec-keyboard.hwdb" <<'HWDB'
# USB Keyboard VID:0x6080 PID:0x8060
evdev:input:b0003v6080p8060*
 KEYBOARD_KEY_700FA=micmute
 KEYBOARD_KEY_700FB=rfkill
 KEYBOARD_KEY_700FC=battery
 KEYBOARD_KEY_700F4=touchpad_off
 KEYBOARD_KEY_700F5=touchpad_on
 KEYBOARD_KEY_700E9=switchvideomode
HWDB
	mkdir -p "${SDCARD}/usr/local/sbin" "${SDCARD}/etc/systemd/system"
	cat > "${SDCARD}/usr/local/sbin/z96a-bt-after-wifi" <<'BTLOAD'
#!/bin/sh
set -u

i=0
while [ "$i" -lt 60 ]; do
	if [ -d /sys/class/net/wlan0 ] && grep -q "^rtw88_8822cs " /proc/modules; then
		if nmcli -t -f DEVICE,STATE device status 2>/dev/null | grep -qx "wlan0:connected"; then
			sleep 5
			exec modprobe hci_uart
		fi
	fi
	i=$((i + 1))
	sleep 1
done

# Preserve Bluetooth availability if no Wi-Fi profile/network is available.
sleep 10
exec modprobe hci_uart
BTLOAD
	cat > "${SDCARD}/etc/udev/rules.d/99-z96a-rkvdec.rules" <<'RKVDEV'
SUBSYSTEM=="video4linux", KERNEL=="video*", ATTR{name}=="rkvdec", SYMLINK+="video-rkvdec"
SUBSYSTEM=="media", ENV{ID_PATH}=="platform-fdf80200.video-codec", SYMLINK+="media-rkvdec"
RKVDEV
	chmod 755 "${SDCARD}/usr/local/sbin/z96a-bt-after-wifi"
	cat > "${SDCARD}/etc/systemd/system/z96a-bt-after-wifi.service" <<'BTSERVICE'
[Unit]
Description=Load RTL8822CS Bluetooth after Wi-Fi initialization
After=NetworkManager.service bluetooth.service
Wants=NetworkManager.service

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/z96a-bt-after-wifi
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target
BTSERVICE
	for mod in rockchipdrm analogix_dp panel_edp pwm_bl rtc_rk808; do
		grep -qxF "$mod" "${SDCARD}/etc/initramfs-tools/modules" 2>/dev/null || \
			echo "$mod" >> "${SDCARD}/etc/initramfs-tools/modules"
	done
	chroot_sdcard systemd-hwdb update >/dev/null 2>&1 || true
	chroot_sdcard systemctl enable z96a-bt-after-wifi.service >/dev/null 2>&1 || true
}
